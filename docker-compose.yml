# MatSMTP - release stack: one container, one volume (SQLite, queue, settings, keys, certificates).
#   docker compose up -d
# Web: http://localhost:2525 (the first visit creates the administrator)
# SMTP: 25 (STARTTLS), 587 (submission, STARTTLS), 465 (TLS) - point your applications here as their smarthost.
name: matsmtp

services:
  matsmtp:
    image: ghcr.io/real-ttx/matsmtp:latest
    container_name: matsmtp
    restart: unless-stopped
    ports:
      - "2525:2525"   # web interface (HTTP: put a reverse proxy with TLS in front)
      - "25:2025"     # SMTP with STARTTLS
      - "587:2587"    # submission with STARTTLS
      - "465:2465"    # SMTP over TLS
    environment:
      TZ: Europe/Berlin
      # MATSMTP__Server__PublicUrl: https://smtp.example.de   # for share links
      # MATSMTP_ADMIN_PASSWORD: ""           # headless: creates the administrator "admin" with this password (8+ characters), no setup page
      # MATSMTP_API_KEY: ""                  # the key of the management API /api/v1 (Mattiverse sets it)
      # MAT_API_KEY: ""                      # the key of /api/* (platform contract; without it MATSMTP_API_KEY serves there too)
      # MATIDENTITY_AUTHORITY: ""            # https://id.example.com: sign-in through MatIdentity
      # MATIDENTITY_CLIENT_ID: "matsmtp"
      # MATIDENTITY_CLIENT_SECRET: ""
      # MATIDENTITY_INTERNAL_URL: ""         # http://matidentity:2300 inside Docker
    volumes:
      - matsmtp-data:/data
      # Backups to a NAS go over SMB from the app (Einstellungen > Backup > Ziele); a mounted folder works as well:
      # - /mnt/nas/matsmtp-backups:/backups

volumes:
  matsmtp-data:
